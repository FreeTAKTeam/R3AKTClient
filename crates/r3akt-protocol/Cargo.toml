[package]
name = "r3akt-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "r3akt_protocol"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
rmpv = "1"
